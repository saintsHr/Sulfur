name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-debug:
    name: Build Debug (${{ matrix.compiler }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    env:
      CC: ${{ matrix.compiler }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            make \
            ccache \
            ${{ matrix.compiler }}

      - name: Cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-debug-${{ matrix.compiler }}-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            ccache-debug-${{ matrix.compiler }}-${{ github.ref }}-
            ccache-debug-${{ matrix.compiler }}-

      - name: Build
        run: |
          chmod +x scripts/build.sh
          ./scripts/build.sh debug all
        env:
          CCACHE_DIR: ~/.cache/ccache

  build-release:
    name: Build Release (${{ matrix.compiler }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    env:
      CC: ${{ matrix.compiler }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            make \
            ccache \
            ${{ matrix.compiler }}

      - name: Cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-release-${{ matrix.compiler }}-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            ccache-release-${{ matrix.compiler }}-${{ github.ref }}-
            ccache-release-${{ matrix.compiler }}-

      - name: Build
        run: |
          chmod +x scripts/build.sh
          ./scripts/build.sh debug all
        env:
          CCACHE_DIR: ~/.cache/ccache
